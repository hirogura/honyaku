<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6bcb">
<title>受付翻訳 | Reception Translation</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b6bcb'/%3E%3Ctext%20x='33'%20y='46'%20font-family='Helvetica,Arial,sans-serif'%20font-size='40'%20font-weight='700'%20text-anchor='middle'%20fill='%23ffffff'%3EJ%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef3f9;
    --panel: #ffffff;
    --ink: #132b42;
    --muted: #5c7186;
    --line: #d5e0ec;
    --accent: #0b6bcb;
    --accent-dark: #084f97;
    --error: #b3261e;
    --radius: 20px;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  .icon-sprite { display: none; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- ヘッダー ---------- */
  .app-header {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    min-width: 0;
    justify-self: start;
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(20px, 1.8vw, 26px);
    letter-spacing: 0.02em;
  }

  .brand .sub {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .brand .version {
    font-size: 12px;
    font-weight: 600;
    color: #8fa3b8;
    letter-spacing: 0.06em;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    justify-self: end;
  }

  .header-btn {
    min-height: 40px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #284862;
    background: #f4f8fd;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .header-btn:hover:not(:disabled) { border-color: #8fb8e0; background: #eaf3fd; }
  .header-btn:active:not(:disabled) { background: #dfecfa; }
  .header-btn:disabled { opacity: 0.5; cursor: wait; }

  .header-btn:focus-visible {
    outline: 3px solid #1c8cf0;
    outline-offset: 2px;
  }

  /* ヘッダー中央に固定表示する。表示・非表示で高さが変わらないよう常に領域を確保する。 */
  .notice {
    justify-self: center;
    min-width: 0;
    max-width: 100%;
    padding: 8px 18px;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #6d5200;
    background: #fff8e6;
    border: 1px solid #f0e0b0;
    border-radius: 999px;
    visibility: hidden;
  }

  .notice.is-visible { visibility: visible; }

  .notice.is-success {
    color: #1e6b3a;
    background: #e9f7ef;
    border-color: #c4e6d2;
  }

  .notice.is-error {
    color: #8c1d18;
    background: #fdecea;
    border-color: #f5c6c2;
  }

  /* ---------- レイアウト（左→右の流れ） ---------- */
  .layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(180px, 14vw) minmax(0, 1fr) auto minmax(0, 1fr);
    gap: clamp(12px, 1.2vw, 22px);
    padding: clamp(14px, 1.4vw, 24px);
  }

  /* ---------- 言語選択 ---------- */
  .languages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .lang-btn {
    flex: 1 1 0;
    min-height: 56px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    font-family: inherit;
    font-size: clamp(17px, 1.25vw, 23px);
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    text-align: left;
    line-height: 1.25;
  }

  .lang-btn:hover { border-color: #8fb8e0; background: #f4f9ff; }
  .lang-btn:active { transform: scale(0.985); }

  .lang-btn[aria-pressed="true"] {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-color: var(--accent-dark);
    box-shadow: 0 6px 16px rgb(11 107 203 / 0.28);
  }

  .lang-btn:focus-visible,
  .translate-btn:focus-visible,
  textarea:focus-visible {
    outline: 3px solid #1c8cf0;
    outline-offset: 2px;
  }

  /* ---------- 入力・出力パネル ---------- */
  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    padding: clamp(14px, 1.2vw, 22px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 2px 10px rgb(19 43 66 / 0.04);
  }

  .pane h2 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .pane h2 .hint {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #90a3b5;
    text-transform: none;
  }

  textarea {
    flex: 1;
    width: 100%;
    min-height: 240px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: clamp(20px, 1.55vw, 27px);
    line-height: 1.55;
    color: var(--ink);
    background: #fbfdff;
    border: 2px solid var(--line);
    border-radius: 14px;
    resize: none;
    caret-color: var(--accent);
  }

  textarea::placeholder { color: #9aabbb; }

  textarea.result {
    flex: 1;
    width: 100%;
    min-height: 240px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: clamp(22px, 1.85vw, 32px);
    line-height: 1.75;
    color: var(--ink);
    background: #f7fbff;
    border: 2px solid #e2ecf6;
    border-radius: 14px;
    resize: none;
    caret-color: var(--accent);
  }

  textarea.result::placeholder { color: #9aabbb; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .pane-foot {
    margin-top: 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    font-size: 12px;
    color: #90a3b5;
    letter-spacing: 0.03em;
  }

  .voice-btn,
  .clear-btn,
  .speak-btn {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 6px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .voice-btn {
    color: #284862;
    background: #f4f8fd;
  }

  .clear-btn {
    color: #5c7488;
    background: #fff;
  }

  .voice-btn:hover:not(:disabled) { border-color: #8fb8e0; background: #eaf3fd; }
  .clear-btn:hover:not(:disabled) { border-color: #b9cbdc; background: #f7fafd; color: #2b4258; }
  .voice-btn:disabled,
  .clear-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .voice-btn.is-listening {
    color: #fff;
    background: #c62828;
    border-color: #a51f1f;
  }

  .voice-btn.is-listening::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    vertical-align: 1px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1s ease-in-out infinite;
  }

  /* 読み上げボタンは行の右端に寄せる。 */
  .speak-btn {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    color: #284862;
    background: #f4f8fd;
  }

  .speak-btn svg { width: 18px; height: 18px; flex: 0 0 auto; }

  .speak-btn:hover:not(:disabled) { border-color: #8fb8e0; background: #eaf3fd; }
  .speak-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .speak-btn.is-active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-color: var(--accent-dark);
  }

  .speak-btn.is-active:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-color: var(--accent-dark);
  }

  .speak-btn.is-speaking svg { animation: speak-pulse 1s ease-in-out infinite; }

  .voice-btn:focus-visible,
  .clear-btn:focus-visible,
  .speak-btn:focus-visible {
    outline: 3px solid #1c8cf0;
    outline-offset: 2px;
  }

  @keyframes pulse { 50% { opacity: 0.25; } }
  @keyframes speak-pulse { 50% { opacity: 0.25; } }

  /* ---------- 翻訳ボタン ---------- */
  .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .translate-btn {
    position: relative;
    width: clamp(84px, 7vw, 112px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    font-family: inherit;
    font-size: clamp(38px, 3vw, 48px);
    line-height: 1;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 10px 24px rgb(11 107 203 / 0.32);
    transition: filter 0.12s, box-shadow 0.12s, opacity 0.12s;
  }

  .translate-btn.is-reverse {
    transform: rotate(180deg);
    background: linear-gradient(135deg, #0f766e, #0b5750);
    box-shadow: 0 10px 24px rgb(15 118 110 / 0.3);
  }

  .translate-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .translate-btn:active:not(:disabled) { filter: brightness(0.94); }
  .translate-btn:disabled { opacity: 0.55; cursor: wait; }

  .translate-btn.is-loading { color: transparent; }

  .translate-btn.is-loading::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 30px;
    height: 30px;
    border: 3px solid rgb(255 255 255 / 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .action-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-align: center;
  }

  /* ---------- タブレット・スマートフォン ---------- */
  @media (max-width: 900px) {
    body { height: auto; }

    .app-header {
      padding: 10px 16px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "brand actions"
        "notice notice";
      row-gap: 8px;
    }
    .brand { gap: 8px; grid-area: brand; }
    .header-actions { grid-area: actions; }
    .header-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
    .notice { grid-area: notice; padding: 6px 14px; font-size: 13px; }

    .layout {
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 12px;
    }

    .languages {
      flex-direction: row;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .lang-btn {
      flex: 0 0 auto;
      min-height: 52px;
      padding: 10px 18px;
      font-size: 18px;
      border-radius: 14px;
      white-space: nowrap;
    }

    .action { padding: 2px 0; }

    .translate-btn {
      width: 84px;
      font-size: 38px;
      transform: rotate(90deg);
    }

    .translate-btn.is-reverse { transform: rotate(-90deg); }

    .action-label { display: none; }

    textarea { min-height: 170px; }
    textarea.result { min-height: 200px; }
  }
</style>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-speaker" viewBox="0 0 24 24">
      <path d="M4 9h3.5L12 5v14L7.5 15H4z" fill="currentColor" />
      <path
        d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round" />
    </symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <h1>受付翻訳</h1>
      <span class="sub">RECEPTION TRANSLATION</span>
      <span class="version">v.0.9.0</span>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="header-actions">
      <button id="ollama" class="header-btn" type="button">Ollama</button>
      <button id="model" class="header-btn" type="button">plamo-3-translate:2b</button>
      <button id="update" class="header-btn" type="button">アップデート</button>
      <button id="restart" class="header-btn" type="button">再起動</button>
    </div>
  </header>

  <main class="layout">
    <nav class="languages" id="languages" aria-label="言語選択 / Language selection"></nav>

    <section class="pane">
      <h2>原文 <span class="hint">Guest</span></h2>
      <textarea
        id="source"
        maxlength="2000"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Please enter here / ここに入力してください"></textarea>
      <div class="pane-foot">
        <button id="voice-source" class="voice-btn" type="button" aria-pressed="false">音声</button>
        <button id="clear-source" class="clear-btn" type="button">クリア</button>
        <span>Ctrl + Enter でも翻訳できます</span>
        <button
          id="speak-source"
          class="speak-btn"
          type="button"
          aria-pressed="false"
          title="この欄の内容を読み上げる">
          <svg aria-hidden="true" focusable="false"><use href="#icon-speaker" /></svg>
          <span>読み上げ</span>
        </button>
      </div>
    </section>

    <div class="action">
      <button id="translate" class="translate-btn" type="button" aria-label="ゲストの言語から日本語に翻訳する">&#10132;</button>
      <span class="action-label">ゲスト → 日本語</span>
      <button id="translate-reverse" class="translate-btn is-reverse" type="button" aria-label="日本語からゲストの言語に翻訳する">&#10132;</button>
      <span class="action-label">日本語 → ゲスト</span>
    </div>

    <section class="pane">
      <h2>日本語訳 <span class="hint">Staff</span></h2>
      <textarea
        id="result"
        class="result"
        maxlength="2000"
        spellcheck="false"
        placeholder="翻訳結果がここに表示されます"></textarea>
      <div class="pane-foot">
        <button id="voice-result" class="voice-btn" type="button" aria-pressed="false">音声</button>
        <button id="clear-result" class="clear-btn" type="button">クリア</button>
        <span>Ctrl + Enter でも翻訳できます</span>
        <button
          id="speak-result"
          class="speak-btn"
          type="button"
          aria-pressed="false"
          title="この欄の内容を読み上げる">
          <svg aria-hidden="true" focusable="false"><use href="#icon-speaker" /></svg>
          <span>読み上げ</span>
        </button>
      </div>
    </section>
  </main>

<script>
  "use strict";

  const languageNav = document.getElementById("languages");
  const source = document.getElementById("source");
  const result = document.getElementById("result");
  const translateButton = document.getElementById("translate");
  const reverseButton = document.getElementById("translate-reverse");

  const SPEECH_LANGUAGES = {
    en: "en-US",
    "zh-Hans": "zh-CN",
    "zh-Hant": "zh-TW",
    ko: "ko-KR",
    vi: "vi-VN",
    tl: "fil-PH",
    es: "es-ES",
  };

  let selectedLanguage = null;
  let translating = false;
  let sourceVoice = null;
  let resultVoice = null;
  let activeVoice = null;

  function selectLanguage(code) {
    if (sourceVoice) sourceVoice.stop();
    selectedLanguage = code;
    for (const button of languageNav.querySelectorAll(".lang-btn")) {
      button.setAttribute("aria-pressed", String(button.dataset.code === code));
    }
    source.focus();
  }

  function renderLanguages(languages) {
    languageNav.replaceChildren();
    for (const language of languages) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "lang-btn";
      button.dataset.code = language.code;
      if (language.html_lang) button.lang = language.html_lang;
      button.textContent = language.label;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => selectLanguage(language.code));
      languageNav.append(button);
    }
    selectLanguage(languages[0].code);
  }

  async function loadLanguages() {
    try {
      const response = await fetch("/api/languages");
      if (!response.ok) throw new Error("HTTP " + response.status);
      renderLanguages(await response.json());
    } catch (error) {
      console.error(error);
      showNotice("言語リストを読み込めませんでした。ページを再読み込みしてください。", "error");
    }
  }

  function setTranslating(busy, activeButton) {
    translating = busy;
    translateButton.disabled = busy;
    reverseButton.disabled = busy;
    translateButton.classList.toggle("is-loading", busy && activeButton === translateButton);
    reverseButton.classList.toggle("is-loading", busy && activeButton === reverseButton);
  }

  async function requestTranslation(endpoint, text) {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, language: selectedLanguage }),
    });
    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error((data && data.detail) || "翻訳に失敗しました（HTTP " + response.status + "）。");
    }

    return data.translation;
  }

  async function translate() {
    if (translating || !selectedLanguage) return;

    const text = source.value.trim();
    if (!text) {
      showNotice("原文を入力してください。", "error");
      source.focus();
      return;
    }

    setTranslating(true, translateButton);
    stopReading();
    showNotice("翻訳しています…");

    try {
      result.value = await requestTranslation("/api/translate", text);
      hideNotice();
      result.focus();
      if (resultSpeaker.isEnabled()) resultSpeaker.speak(result.value.trim());
    } catch (error) {
      console.error(error);
      showNotice(error.message || "通信エラーが発生しました。", "error");
    } finally {
      setTranslating(false, translateButton);
    }
  }

  async function translateReverse() {
    if (translating || !selectedLanguage) return;

    if (selectedLanguage === "auto") {
      showNotice("「Other Languages」では逆方向の翻訳ができません。言語を選択してください。", "error");
      return;
    }

    const text = result.value.trim();
    if (!text) {
      showNotice("日本語訳を入力してください。", "error");
      result.focus();
      return;
    }

    setTranslating(true, reverseButton);
    showNotice("翻訳しています…");

    try {
      source.value = await requestTranslation("/api/translate/reverse", text);
      hideNotice();
      source.focus();
      if (sourceSpeaker.isEnabled()) sourceSpeaker.speak(source.value.trim());
    } catch (error) {
      console.error(error);
      showNotice(error.message || "通信エラーが発生しました。", "error");
    } finally {
      setTranslating(false, reverseButton);
    }
  }

  function createVoiceInput(button, textarea, getLanguage) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      button.disabled = true;
      button.title = "このブラウザは音声入力に対応していません（Chrome / Safari をお使いください）";
      return null;
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let listening = false;
    let baseText = "";
    let discard = false;

    function setListening(value) {
      listening = value;
      button.classList.toggle("is-listening", value);
      button.setAttribute("aria-pressed", String(value));
      button.textContent = value ? "停止" : "音声";
    }

    const controller = {
      stop() {
        if (listening) recognition.stop();
      },
      clear() {
        discard = true;
        if (listening) {
          try {
            recognition.abort();
          } catch (error) {
            console.error(error);
          }
        }
        setListening(false);
        if (activeVoice === controller) activeVoice = null;
        textarea.value = "";
        textarea.focus();
      },
      toggle() {
        if (listening) {
          recognition.stop();
          return;
        }

        if (activeVoice && activeVoice !== controller) activeVoice.stop();
        activeVoice = controller;
        discard = false;
        baseText = textarea.value.trim();

        const language = getLanguage();
        if (language) recognition.lang = language;
        else recognition.lang = navigator.language || "en-US";

        try {
          recognition.start();
        } catch (error) {
          console.error(error);
          if (activeVoice === controller) activeVoice = null;
          showNotice("音声入力を開始できませんでした。", "error");
        }
      },
    };

    recognition.addEventListener("start", () => setListening(true));

    recognition.addEventListener("result", (event) => {
      if (discard) return;
      let transcript = "";
      for (let index = 0; index < event.results.length; index += 1) {
        transcript += event.results[index][0].transcript;
      }
      const prefix = baseText ? baseText + " " : "";
      const maxLength = Number(textarea.getAttribute("maxlength")) || 2000;
      textarea.value = (prefix + transcript).trim().slice(0, maxLength);
    });

    recognition.addEventListener("end", () => {
      setListening(false);
      if (activeVoice === controller) activeVoice = null;
    });

    recognition.addEventListener("error", (event) => {
      if (event.error === "aborted") return;
      const messages = {
        "not-allowed": "マイクの使用が許可されていません。ブラウザの設定を確認してください。",
        "audio-capture": "マイクが見つかりません。接続を確認してください。",
        "no-speech": "音声が聞き取れませんでした。もう一度お試しください。",
        network: "音声認識サーバーに接続できませんでした。",
      };
      showNotice(messages[event.error] || "音声入力を開始できませんでした。", "error");
    });

    button.addEventListener("click", controller.toggle);
    return controller;
  }

  const ollamaButton = document.getElementById("ollama");
  const modelButton = document.getElementById("model");
  const updateButton = document.getElementById("update");
  const restartButton = document.getElementById("restart");
  const notice = document.getElementById("notice");

  let maintenanceBusy = false;
  let installRunning = false;
  let ollamaInstalled = false;
  let modelInstallRunning = false;
  let modelInstalled = false;

  function showNotice(text, kind) {
    notice.textContent = text;
    notice.title = text;
    notice.className = "notice is-visible" + (kind ? " is-" + kind : "");
  }

  function hideNotice() {
    notice.textContent = "";
    notice.title = "";
    notice.className = "notice";
  }

  function syncHeaderButtons() {
    updateButton.disabled = maintenanceBusy;
    restartButton.disabled = maintenanceBusy;
    ollamaButton.disabled = maintenanceBusy || installRunning || ollamaInstalled;
    ollamaButton.title = ollamaInstalled ? "Ollama はインストール済みです" : "";
    modelButton.disabled = maintenanceBusy || modelInstallRunning || modelInstalled || !ollamaInstalled;
    if (modelInstalled) {
      modelButton.title = "インストール済みです";
    } else if (!ollamaInstalled) {
      modelButton.title = "先に Ollama をインストールしてください";
    } else {
      modelButton.title = "";
    }
  }

  function setMaintenanceBusy(busy) {
    maintenanceBusy = busy;
    syncHeaderButtons();
  }

  async function runUpdate() {
    if (maintenanceBusy) return;
    if (!window.confirm("GitHub から最新版を取得します。よろしいですか？")) return;

    setMaintenanceBusy(true);
    showNotice("アップデートを確認しています…");

    try {
      const response = await fetch("/api/update", { method: "POST" });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error((data && data.detail) || "アップデートに失敗しました。");
      }
      if (data.changed) {
        showNotice("最新版に更新しました。反映するには「再起動」を押してください。", "success");
      } else {
        showNotice("すでに最新版です。", "success");
      }
    } catch (error) {
      console.error(error);
      showNotice(error.message || "アップデートに失敗しました。", "error");
    } finally {
      setMaintenanceBusy(false);
    }
  }

  async function waitForRestart() {
    await new Promise((resolve) => setTimeout(resolve, 3000));
    for (let attempt = 0; attempt < 30; attempt += 1) {
      try {
        const response = await fetch("/api/languages", { cache: "no-store" });
        if (response.ok) return true;
      } catch (error) {
        // 再起動中は接続できないので、少し待って再試行する
      }
      await new Promise((resolve) => setTimeout(resolve, 1000));
    }
    return false;
  }

  async function runRestart() {
    if (maintenanceBusy) return;
    if (!window.confirm("受付翻訳サービスを再起動します。数秒間アクセスできなくなります。よろしいですか？")) return;

    setMaintenanceBusy(true);
    showNotice("再起動しています…");

    try {
      const response = await fetch("/api/restart", { method: "POST" });
      if (!response.ok) {
        const data = await response.json().catch(() => null);
        throw new Error((data && data.detail) || "再起動に失敗しました。");
      }
    } catch (error) {
      console.error(error);
      showNotice(error.message || "再起動に失敗しました。", "error");
      setMaintenanceBusy(false);
      return;
    }

    if (await waitForRestart()) {
      location.reload();
      return;
    }

    showNotice("再起動を確認できませんでした。手動で状態を確認してください。", "error");
    setMaintenanceBusy(false);
  }

  async function refreshOllamaStatus() {
    try {
      const response = await fetch("/api/ollama", { cache: "no-store" });
      if (!response.ok) return null;
      const data = await response.json();
      ollamaInstalled = Boolean(data.installed);
      if (data.state === "installing") installRunning = true;
      syncHeaderButtons();
      return data;
    } catch (error) {
      return null;
    }
  }

  async function waitForOllamaInstall() {
    for (let attempt = 0; attempt < 200; attempt += 1) {
      const data = await refreshOllamaStatus();
      if (data && data.installed) return data;
      if (data && data.state === "error") return data;
      await new Promise((resolve) => setTimeout(resolve, 3000));
    }
    return null;
  }

  async function runOllamaInstall() {
    if (maintenanceBusy || installRunning || ollamaInstalled) return;
    if (!window.confirm("Ollama をインストールします。回線状況により数分かかる場合があります。よろしいですか？")) return;

    setMaintenanceBusy(true);
    installRunning = true;
    syncHeaderButtons();
    showNotice("Ollama をインストールしています…（数分かかる場合があります）");

    try {
      const response = await fetch("/api/ollama/install", { method: "POST" });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error((data && data.detail) || "インストールを開始できませんでした。");
      }
    } catch (error) {
      console.error(error);
      installRunning = false;
      setMaintenanceBusy(false);
      showNotice(error.message || "インストールを開始できませんでした。", "error");
      return;
    }

    const result = await waitForOllamaInstall();
    installRunning = false;
    setMaintenanceBusy(false);

    if (result && result.installed) {
      ollamaInstalled = true;
      syncHeaderButtons();
      showNotice("Ollama のインストールが完了しました。", "success");
      return;
    }

    showNotice(
      (result && result.message) || "インストールの完了を確認できませんでした。ログを確認してください。",
      "error",
    );
  }

  async function initOllama() {
    const data = await refreshOllamaStatus();
    if (!data || data.state !== "installing") return;

    setMaintenanceBusy(true);
    installRunning = true;
    syncHeaderButtons();
    showNotice("Ollama をインストールしています…（数分かかる場合があります）");

    const result = await waitForOllamaInstall();
    installRunning = false;
    setMaintenanceBusy(false);

    if (result && result.installed) {
      ollamaInstalled = true;
      syncHeaderButtons();
      showNotice("Ollama のインストールが完了しました。", "success");
      return;
    }

    showNotice(
      (result && result.message) || "インストールの完了を確認できませんでした。ログを確認してください。",
      "error",
    );
  }

  async function refreshModelStatus() {
    try {
      const response = await fetch("/api/model", { cache: "no-store" });
      if (!response.ok) return null;
      const data = await response.json();
      modelInstalled = Boolean(data.installed);
      if (data.state === "installing") modelInstallRunning = true;
      syncHeaderButtons();
      return data;
    } catch (error) {
      return null;
    }
  }

  async function waitForModelInstall() {
    for (let attempt = 0; attempt < 400; attempt += 1) {
      const data = await refreshModelStatus();
      if (data && data.installed) return data;
      if (data && data.state === "error") return data;
      await new Promise((resolve) => setTimeout(resolve, 3000));
    }
    return null;
  }

  async function runModelInstall() {
    if (maintenanceBusy || modelInstallRunning || modelInstalled) return;
    if (!ollamaInstalled) {
      showNotice("先に Ollama をインストールしてください。", "error");
      return;
    }
    if (!window.confirm("plamo-3-translate:2b をインストールします。約2GBのダウンロードが発生し、数分かかる場合があります。よろしいですか？")) return;

    setMaintenanceBusy(true);
    modelInstallRunning = true;
    syncHeaderButtons();
    showNotice("plamo-3-translate:2b をインストールしています…（数分かかる場合があります）");

    try {
      const response = await fetch("/api/model/install", { method: "POST" });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error((data && data.detail) || "インストールを開始できませんでした。");
      }
    } catch (error) {
      console.error(error);
      modelInstallRunning = false;
      setMaintenanceBusy(false);
      showNotice(error.message || "インストールを開始できませんでした。", "error");
      return;
    }

    const result = await waitForModelInstall();
    modelInstallRunning = false;
    setMaintenanceBusy(false);

    if (result && result.installed) {
      modelInstalled = true;
      syncHeaderButtons();
      showNotice("plamo-3-translate:2b のインストールが完了しました。", "success");
      return;
    }

    showNotice(
      (result && result.message) || "インストールの完了を確認できませんでした。ログを確認してください。",
      "error",
    );
  }

  async function initModel() {
    const data = await refreshModelStatus();
    if (!data || data.state !== "installing") return;

    setMaintenanceBusy(true);
    modelInstallRunning = true;
    syncHeaderButtons();
    showNotice("plamo-3-translate:2b をインストールしています…（数分かかる場合があります）");

    const result = await waitForModelInstall();
    modelInstallRunning = false;
    setMaintenanceBusy(false);

    if (result && result.installed) {
      modelInstalled = true;
      syncHeaderButtons();
      showNotice("plamo-3-translate:2b のインストールが完了しました。", "success");
      return;
    }

    showNotice(
      (result && result.message) || "インストールの完了を確認できませんでした。ログを確認してください。",
      "error",
    );
  }

  ollamaButton.addEventListener("click", runOllamaInstall);
  modelButton.addEventListener("click", runModelInstall);
  updateButton.addEventListener("click", runUpdate);
  restartButton.addEventListener("click", runRestart);

  translateButton.addEventListener("click", translate);
  reverseButton.addEventListener("click", translateReverse);

  source.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      translate();
    }
  });

  result.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      translateReverse();
    }
  });

  sourceVoice = createVoiceInput(
    document.getElementById("voice-source"),
    source,
    () => SPEECH_LANGUAGES[selectedLanguage] || navigator.language || "",
  );
  resultVoice = createVoiceInput(
    document.getElementById("voice-result"),
    result,
    () => "ja-JP",
  );

  // ---------- 読み上げ（Web Speech API） ----------
  const synthesizer = window.speechSynthesis;
  const speakers = [];

  function stopReading() {
    for (const speaker of speakers) speaker.stop();
  }

  // Chrome は 1 回の発話が長すぎると途中で切れるため、文単位でおよそ 180 文字に分割する。
  function splitForSpeech(text, limit = 180) {
    const normalized = text.replace(/\s+/g, " ").trim();
    const sentences = normalized.match(/[^。．.!?！？]+[。．.!?！？]*/g) || [];
    const chunks = [];
    let current = "";

    for (const sentence of sentences) {
      if (sentence.length > limit) {
        if (current) {
          chunks.push(current);
          current = "";
        }
        for (let index = 0; index < sentence.length; index += limit) {
          chunks.push(sentence.slice(index, index + limit));
        }
        continue;
      }
      if (current.length + sentence.length > limit) {
        chunks.push(current);
        current = "";
      }
      current += sentence;
    }

    if (current) chunks.push(current);
    return chunks.map((chunk) => chunk.trim()).filter(Boolean);
  }

  // 読み上げボタンは、押すと有効になって内容を読み上げ、以降はその欄に翻訳結果が
  // 表示されたときに自動で読み上げる。もう一度押すと停止する。
  function createSpeaker(button, textarea, getLanguage) {
    if (!synthesizer) {
      button.disabled = true;
      button.title = "このブラウザは読み上げに対応していません（Chrome / Safari をお使いください）";
      return { speak() {}, stop() {}, isEnabled: () => false };
    }

    let enabled = false;
    let token = 0;

    function setSpeaking(value) {
      button.classList.toggle("is-speaking", value);
    }

    function pickVoice(language) {
      const voices = synthesizer.getVoices();
      const normalized = (language || "").toLowerCase();
      return (
        voices.find((voice) => (voice.lang || "").toLowerCase() === normalized) ||
        voices.find((voice) => (voice.lang || "").toLowerCase().startsWith(normalized.split("-")[0])) ||
        null
      );
    }

    function stop() {
      token += 1;
      synthesizer.cancel();
      setSpeaking(false);
    }

    function speak(text) {
      stopReading();

      const chunks = splitForSpeech(text);
      if (!chunks.length) return;

      const language = getLanguage() || "ja-JP";
      const voice = pickVoice(language);
      const currentToken = token;

      // Chrome では cancel() の直後に speak() すると無視されることがあるため、次のタスクで開始する。
      setTimeout(() => {
        if (currentToken !== token) return;

        chunks.forEach((chunk, index) => {
          const utterance = new SpeechSynthesisUtterance(chunk);
          utterance.lang = language;
          if (voice) utterance.voice = voice;

          if (index === chunks.length - 1) {
            const finish = () => {
              if (currentToken === token) setSpeaking(false);
            };
            utterance.addEventListener("end", finish);
            utterance.addEventListener("error", finish);
          }

          synthesizer.speak(utterance);
        });

        setSpeaking(true);
      }, 0);
    }

    button.addEventListener("click", () => {
      enabled = !enabled;
      button.setAttribute("aria-pressed", String(enabled));
      button.classList.toggle("is-active", enabled);
      button.title = enabled
        ? "この欄の内容を自動で読み上げます（もう一度押すと停止）"
        : "この欄の内容を読み上げる";

      if (enabled) speak(textarea.value.trim());
      else stop();
    });

    return { speak, stop, isEnabled: () => enabled };
  }

  const sourceSpeaker = createSpeaker(
    document.getElementById("speak-source"),
    source,
    () => SPEECH_LANGUAGES[selectedLanguage] || navigator.language || "",
  );
  const resultSpeaker = createSpeaker(
    document.getElementById("speak-result"),
    result,
    () => "ja-JP",
  );
  speakers.push(sourceSpeaker, resultSpeaker);

  function clearInput(voice, textarea) {
    if (voice) {
      voice.clear();
      return;
    }
    textarea.value = "";
    textarea.focus();
  }

  document.getElementById("clear-source").addEventListener("click", () => {
    sourceSpeaker.stop();
    clearInput(sourceVoice, source);
  });
  document.getElementById("clear-result").addEventListener("click", () => {
    resultSpeaker.stop();
    clearInput(resultVoice, result);
  });

  syncHeaderButtons();
  loadLanguages();
  initOllama();
  initModel();
</script>
</body>
</html>
